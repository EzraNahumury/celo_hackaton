name: check-balances

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - name: Check balances
        env:
          WALLETS: ${{ secrets.WALLETS }}
          NEW_WALLETS: ${{ secrets.NEW_WALLETS }}
          TOKEN_ADDRESS: ${{ secrets.TOKEN_ADDRESS }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
          TOKEN_DECIMALS: ${{ vars.TOKEN_DECIMALS || '6' }}
        run: node check-balances.mjs
