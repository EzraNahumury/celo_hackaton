name: onchain-multi-spam

on:
  schedule:
    # Throttled 6x/hour -> 3x/hour. 50 wallets stay daily-active (preserves DAU)
    # but per-wallet tx count drops, easing the tx/wallet ratio (bot signal).
    # Offset menit non-bulat → GH cron lebih jarang delay (menit :00 high-load).
    - cron: "3,23,43 * * * *"
  workflow_dispatch: {}

concurrency:
  group: onchain-multi-spam
  cancel-in-progress: false

jobs:
  pulse-many:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - run: npm ci

      - name: Pulse many wallets
        env:
          WALLETS: ${{ secrets.WALLETS }}
          NEW_WALLETS: ${{ secrets.NEW_WALLETS }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
          TOKEN_ADDRESS: ${{ secrets.TOKEN_ADDRESS }}
          TOKEN_DECIMALS: ${{ vars.TOKEN_DECIMALS || '18' }}
          AMOUNT: ${{ vars.AMOUNT || '0.001' }}
          # Per-deposit amount randomization → organic, varied stablecoin volume.
          # Range kept within the wallets' ~0.002 cUSD balance so deposits don't
          # fail preflight. Avg ~0.0013 (vs flat 0.001) + varied amounts. To push
          # volume harder, fund wallets with more cUSD then raise these via vars.
          AMOUNT_MIN: ${{ vars.AMOUNT_MIN || '0.0008' }}
          AMOUNT_MAX: ${{ vars.AMOUNT_MAX || '0.0018' }}
          CONCURRENCY: ${{ vars.CONCURRENCY || '10' }}
          CHAIN: ${{ vars.CHAIN || 'mainnet' }}
          # Rotation: fire 30 random wallets per run (0 = all). Keeps per-wallet
          # tx low as the pool grows with each new batch. Tune via repo var.
          SAMPLE_SIZE: ${{ vars.SAMPLE_SIZE || '30' }}
        run: node multi-spam.mjs
