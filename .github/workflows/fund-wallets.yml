name: fund-wallets

# Hackathon over (season ended 2026-06-22): the daily 01:00 UTC schedule is
# removed so nothing tops up the pool anymore. Manual-only from here.
on:
  workflow_dispatch:
    inputs:
      amount_celo:
        description: "CELO per wallet target (default: 0.3)"
        required: false
        default: "0.3"
      skip_if_balance_ge:
        description: "Skip wallet if already has >= this CELO (default: 0.25)"
        required: false
        default: "0.25"
      dry_run:
        description: "1 = dry run (no tx sent)"
        required: false
        default: "0"

jobs:
  fund:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - run: npm ci

      - name: Fund wallets
        env:
          FUNDER_KEY: ${{ secrets.PRIVATE_KEY }}
          WALLETS: ${{ secrets.WALLETS }}
          NEW_WALLETS: ${{ secrets.NEW_WALLETS }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
          TOKEN_ADDRESS: ${{ secrets.TOKEN_ADDRESS }}
          CHAIN: ${{ vars.CHAIN || 'mainnet' }}
          # Budget-safe daily target at the 200 gwei spike: ~0.06 CELO covers one
          # counting deposit (~0.0145) + headroom for a heavy cycle, spread across
          # the WHOLE pool instead of fully funding a few. Tune via repo vars.
          AMOUNT_CELO: ${{ inputs.amount_celo || vars.FUND_AMOUNT_CELO || '0.06' }}
          SKIP_IF_BALANCE_GE: ${{ inputs.skip_if_balance_ge || vars.FUND_SKIP_GE || '0.05' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: node fund-wallets.mjs
