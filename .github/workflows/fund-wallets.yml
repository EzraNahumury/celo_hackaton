name: fund-wallets

on:
  schedule:
    # Auto top-up every 3 days at 01:00 UTC
    - cron: "0 1 */3 * *"
  workflow_dispatch:
    inputs:
      amount_celo:
        description: "CELO per wallet target (default: 0.3)"
        required: false
        default: "0.3"
      skip_if_balance_ge:
        description: "Skip wallet if already has >= this CELO (default: 0.25)"
        required: false
        default: "0.25"
      dry_run:
        description: "1 = dry run (no tx sent)"
        required: false
        default: "0"

jobs:
  fund:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - run: npm ci

      - name: Fund wallets
        env:
          FUNDER_KEY: ${{ secrets.PRIVATE_KEY }}
          WALLETS: ${{ secrets.WALLETS }}
          NEW_WALLETS: ${{ secrets.NEW_WALLETS }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
          TOKEN_ADDRESS: ${{ secrets.TOKEN_ADDRESS }}
          CHAIN: ${{ vars.CHAIN || 'mainnet' }}
          AMOUNT_CELO: ${{ inputs.amount_celo || '0.3' }}
          SKIP_IF_BALANCE_GE: ${{ inputs.skip_if_balance_ge || '0.25' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: node fund-wallets.mjs
