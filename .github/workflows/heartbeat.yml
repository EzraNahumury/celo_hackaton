name: onchain-dau-floor

# Hackathon over (season ended 2026-06-22): the daily DAU-floor schedule is
# removed — no more automated deposits. Manual-only from here.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Wallets to fire this run (0 = all). Overrides SAMPLE_SIZE."
        required: false
        default: ""

concurrency:
  group: onchain-dau-floor
  cancel-in-progress: false

jobs:
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - run: npm ci

      - name: DAU floor (one dust contract deposit per wallet)
        env:
          WALLETS: ${{ secrets.WALLETS }}
          NEW_WALLETS: ${{ secrets.NEW_WALLETS }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
          TOKEN_ADDRESS: ${{ secrets.TOKEN_ADDRESS }}
          TOKEN_DECIMALS: ${{ vars.TOKEN_DECIMALS || '18' }}
          CHAIN: ${{ vars.CHAIN || 'mainnet' }}
          # Deposit-only: skip the withdraw leg. The deposit is the counting tx.
          DEPOSIT_ONLY: "1"
          # Dust per wallet — only needs to be > 0. Stays locked in the vault.
          AMOUNT: ${{ vars.FLOOR_AMOUNT || '0.0001' }}
          # Full pool by default (every wallet a DAU). Dispatch input can sample.
          SAMPLE_SIZE: ${{ github.event.inputs.sample || vars.FLOOR_SAMPLE || '0' }}
          # Must afford a ~70k-gas deposit at the current spike (+ first-time approve).
          MIN_GAS_CELO: ${{ vars.FLOOR_MIN_GAS_CELO || '0.02' }}
          CONCURRENCY: ${{ vars.FLOOR_CONCURRENCY || '12' }}
        run: node multi-spam.mjs
