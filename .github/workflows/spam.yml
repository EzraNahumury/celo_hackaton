name: onchain-spam

on:
  schedule:
    # Single-wallet pulse — throttled to 2x/hour. This wallet adds tx volume but
    # ZERO wallet diversity, so a high cadence here wrecks the tx/wallet ratio
    # (bot signal in Proof-of-Ship scoring). Keep it alive as a daily-active
    # wallet without flooding. Offset minutes avoid GH cron :00 congestion.
    - cron: "8,38 * * * *"
  workflow_dispatch: {}

concurrency:
  group: onchain-spam
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - run: npm ci

      - name: Pulse one cycle
        env:
          MODE: once
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
          TOKEN_ADDRESS: ${{ secrets.TOKEN_ADDRESS }}
          TOKEN_DECIMALS: ${{ vars.TOKEN_DECIMALS || '6' }}
          AMOUNT: ${{ vars.AMOUNT || '0.01' }}
          CHAIN: ${{ vars.CHAIN || 'mainnet' }}
        run: node spam.mjs
